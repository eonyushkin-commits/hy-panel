<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>hy-panel</title>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface-2:#f0f2f5;--fg:#111318;--mute:#6b7280;--line:#e4e7ec;
  --acc:#4f46e5;--acc-soft:#4f46e51a;--ok:#16a34a;--ok-soft:#16a34a1f;--bad:#dc2626;--bad-soft:#dc26261a;--warn:#c2410c;--warn-soft:#ea580c1f;
  --shadow:0 1px 2px #1018280d,0 1px 3px #1018280f;--shadow-lg:0 20px 40px -12px #10182840;
  --r:14px;--r-sm:9px;--on-acc:#fff;
}
/* dark: the system's choice, or the one made with the header button */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c0d10;--surface:#15171c;--surface-2:#1d2027;--fg:#e8eaee;--mute:#8d94a1;--line:#262a33;
  --acc:#818cf8;--acc-soft:#818cf826;--ok:#4ade80;--ok-soft:#4ade801f;--bad:#f87171;--bad-soft:#f871711f;--warn:#fb923c;--warn-soft:#fb923c1f;
  --shadow:0 0 0 1px #ffffff08;--shadow-lg:0 24px 48px -12px #000a;color-scheme:dark;--on-acc:#0c0d10;
}}
:root[data-theme=dark]{
  --bg:#0c0d10;--surface:#15171c;--surface-2:#1d2027;--fg:#e8eaee;--mute:#8d94a1;--line:#262a33;
  --acc:#818cf8;--acc-soft:#818cf826;--ok:#4ade80;--ok-soft:#4ade801f;--bad:#f87171;--bad-soft:#f871711f;--warn:#fb923c;--warn-soft:#fb923c1f;
  --shadow:0 0 0 1px #ffffff08;--shadow-lg:0 24px 48px -12px #000a;color-scheme:dark;--on-acc:#0c0d10;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:920px;margin:0 auto;padding:0 16px 64px}
h1,h2{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:17px}h2{font-size:16px}
.mute{color:var(--mute)}.small{font-size:12.5px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button,input,select,textarea{font:inherit;color:inherit}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
button:hover{background:var(--surface-2)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);border-color:transparent;color:var(--on-acc);font-weight:550}
button.pri:hover{filter:brightness(1.08)}
button.ghost{background:none;border-color:transparent}
button.ghost:hover{background:var(--surface-2)}
button.icon{padding:7px;color:var(--mute)}
button.icon:hover{color:var(--fg)}
button.icon.danger:hover{color:var(--bad);background:var(--bad-soft)}
button.danger{color:var(--bad)}
input,textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;width:100%;transition:border-color .15s}
input:hover,textarea:hover,select:hover{border-color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* header */
.top{position:sticky;top:0;z-index:5;margin:0 -16px 20px;padding:14px 16px;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),#06b6d4);color:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:60%;height:60%}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.err{display:flex;gap:8px;align-items:center;background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:var(--r-sm);margin-bottom:16px;font-size:13px}

/* toolbar */
.bar-tools{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mute)}
.search input{padding-left:34px}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface-2);border-radius:var(--r-sm)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;color:var(--mute);font-size:13px}
.seg button.act{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
#mtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:12px}
#mtabs button{min-width:0;padding:5px 6px;overflow-wrap:anywhere}

/* users */
.user{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
.user:first-child{border-top:0}
.user.off{opacity:.6}
.av{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:650;flex:none;text-transform:uppercase;background:hsl(var(--h) 70% 50% / .16);color:hsl(var(--h) 55% 42%)}
@media (prefers-color-scheme:dark){.av{color:hsl(var(--h) 75% 72%);background:hsl(var(--h) 60% 50% / .2)}}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.av.on::after{background:var(--ok)}
.av.stale::after{background:var(--warn)}
.body{flex:1;min-width:0}
.name{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:550;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--mute)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.meta{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:2px}
.meta span{white-space:nowrap}.meta .note{white-space:normal;overflow-wrap:anywhere}
.prog{height:5px;background:var(--surface-2);border-radius:99px;margin-top:8px;overflow:hidden;max-width:340px}
.prog i{display:block;height:100%;border-radius:inherit;background:var(--acc);transition:width .4s}
.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}
.acts{display:flex;gap:2px;align-items:center;flex:none}
.sw{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0 6px 0 0;padding:0;border:0;transition:background .2s;flex:none}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:transform .2s}
.sw:checked{background:var(--ok)}.sw:checked::before{transform:translateX(14px)}
.empty{padding:48px 16px;text-align:center}

/* server status and details */
.server-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.server-state,.server-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.server-dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--mute)}
.server-dot.ok{background:var(--ok)}.server-dot.bad{background:var(--bad)}.server-dot.warn{background:var(--warn)}
.server-details{padding:12px 14px;background:var(--surface-2);border-radius:var(--r-sm);margin-bottom:16px;display:grid;gap:8px}
.server-details .detail{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.server-details .detail span:last-child{text-align:right;overflow-wrap:anywhere}
.server-details .detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.server-details .check{margin:0}
.sessions{font-weight:400;color:var(--mute);font-size:12px}
.joblog{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;max-height:50vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.check{font-size:12.5px;margin-top:6px}.check.ok{color:var(--ok)}.check.bad{color:var(--bad)}
.empty button{margin-top:12px}

/* dialogs */
dialog{border:0;border-radius:18px;background:var(--surface);color:var(--fg);padding:0;width:min(460px,calc(100vw - 24px));box-shadow:var(--shadow-lg)}
#share{width:min(640px,calc(100vw - 24px))}
dialog[open]{animation:pop .18s ease-out}
dialog::backdrop{background:#0b0d1299;backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.dlg{padding:20px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label span{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}
.tip{position:static;display:inline-flex;vertical-align:-3px;padding:0;margin-left:2px;border:0;background:none;color:var(--mute);cursor:help}
.tip:hover,.tip:focus-visible{color:var(--acc);background:none}
.tip svg{width:15px;height:15px}
.grid label{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:0;right:0;top:26px;z-index:2;padding:9px 12px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.45;text-align:left;white-space:normal;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transition:opacity .15s}
.tip:hover::after,.tip:focus::after{opacity:1;visibility:visible}
.chk{display:flex!important;align-items:center;gap:10px;font-size:13.5px;cursor:pointer}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.qr{display:block;margin:0 auto 14px;background:#fff;padding:10px;border-radius:12px;width:232px;height:232px;border:1px solid var(--line)}
textarea{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border-color:transparent;resize:vertical}
.hint{margin-top:8px}
#login{max-width:340px;margin:18vh auto 0;padding:28px 24px}
#login .logo{width:40px;height:40px;border-radius:12px;margin-bottom:14px}
#login h1{margin-bottom:4px}
#login form{margin-top:18px;display:grid;gap:12px}

/* toast */
#toasts{position:fixed;inset:auto;left:50%;bottom:20px;transform:translateX(-50%);display:grid;gap:8px;z-index:20;width:max-content;max-width:calc(100vw - 32px);margin:0;padding:0;border:0;background:none;color:inherit;overflow:visible}
#toasts[popover]:not(:popover-open){display:none}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);animation:pop .18s ease-out}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:640px){
  .stats{gap:8px}.stat{padding:12px}.stat b{font-size:18px}
  .user{flex-wrap:wrap}.acts{width:100%;padding-left:52px}
  .top .lbl{display:none}
}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
@media (min-width:640px){#mtabs button{white-space:nowrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M20.5 18v3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></symbol>
</svg>

<main>
  <div id="login" class="card" hidden>
    <div class="logo"><svg class="i"><use href="#i-globe"/></svg></div>
    <h1>hy-panel</h1>
    <div class="mute small">VPN-панель Hysteria 2</div>
    <form>
      <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus>
      <button class="pri">Войти</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="top">
      <div class="brand">
        <div class="logo"><svg class="i"><use href="#i-globe"/></svg></div>
        <div style="min-width:0">
          <h1>hy-panel</h1>
          <div class="mute small" id="host"></div>
        </div>
      </div>
      <button class="pri" onclick="openEdit()"><svg class="i"><use href="#i-plus"/></svg><span class="lbl">Пользователь</span></button>
      <button class="icon ghost" id="themeBtn" onclick="toggleTheme()"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="icon ghost" onclick="logout()" title="Выйти" aria-label="Выйти"><svg class="i"><use href="#i-out"/></svg></button>
    </header>

    <div id="hyerr" class="err" hidden></div>

    <div class="stats">
      <div class="card stat"><span class="mute small">Пользователи</span><b id="stUsers">0</b><span class="mute small" id="stUsersSub"></span></div>
      <div class="card stat"><span class="mute small">Онлайн</span><b id="stOnline">0</b><span class="mute small" id="stOnlineSub" hidden></span></div>
      <div class="card stat"><span class="mute small">Трафик</span><b id="stTraffic">0</b></div>
    </div>

    <div id="serverStatus" aria-live="polite"></div>

    <div class="bar-tools">
      <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Поиск по имени или заметке" aria-label="Поиск"></label>
      <div class="seg" id="filter">
        <button data-f="all" class="act">Все</button><button data-f="online">Онлайн</button><button data-f="issues">Проблемы</button>
      </div>
    </div>
    <div id="list" class="card"></div>
  </div>
</main>

<dialog id="edit">
  <form method="dialog" id="editForm" class="dlg">
    <div class="dlg-h"><h2 id="editTitle"></h2><button type="button" class="icon ghost" onclick="$('#edit').close()" aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="grid">
      <label class="full" id="nameWrap"><span>Имя (a-z 0-9 _ . -)</span><input name="name" required pattern="[A-Za-z0-9_.\-]{1,32}" autocapitalize="off" autocomplete="off"></label>
      <label><span>Лимит трафика, ГБ</span><input name="quota" type="number" min="0" step="any" placeholder="без лимита"></label>
      <label><span>Устройств одновременно <button type="button" class="tip" onclick="this.focus()" aria-label="Подсказка" data-tip="Телефону лучше разрешить не меньше двух устройств. Когда телефон переключается между Wi-Fi и мобильной сетью, прежнее подключение сохраняется ещё около тридцати секунд и тоже учитывается в лимите."><svg class="i"><use href="#i-info"/></svg></button></span><input name="devices" type="number" min="0" placeholder="без лимита"></label>
      <label><span>Действует до</span><input name="expires" type="date"></label>
      <label><span>Пароль</span><input name="password" autocomplete="off" pattern="[^:\s]{8,128}" title="8–128 символов, без двоеточия и пробелов"></label>
      <label class="full chk"><input type="checkbox" name="monthly" class="sw"> Сбрасывать трафик 1-го числа</label>
      <label class="full"><span>Заметка</span><input name="note" maxlength="200"></label>
    </div>
    <div class="row">
      <button type="button" id="rekeyBtn" class="danger" style="margin-right:auto" onclick="rekey()">Новый ключ</button>
      <button type="button" onclick="$('#edit').close()">Отмена</button>
      <button class="pri" value="ok">Сохранить</button>
    </div>
  </form>
</dialog>

<dialog id="share">
  <div class="dlg">
    <div class="dlg-h"><h2 id="shareTitle"></h2><button class="icon ghost" onclick="$('#share').close()" aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="seg" id="tabs" style="display:flex;margin-bottom:16px">
    </div>
    <div class="seg" id="mtabs"></div>
    <img class="qr" id="qr" alt="QR-код">
    <textarea id="shareText" rows="4" readonly></textarea>
    <div class="mute small hint" id="shareHint"></div>
    <div class="row"><button id="dlConf" onclick="location.href=dlURL">Скачать</button><button class="pri" onclick="copyShare()"><svg class="i"><use href="#i-copy"/></svg>Копировать</button></div>
  </div>
</dialog>

<dialog id="hyDlg">
  <form method="dialog" id="hyForm" class="dlg">
    <div class="dlg-h"><h2>Hysteria 2</h2><button type="button" class="icon ghost" onclick="$('#hyDlg').close()" aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="server-details small" id="hyInfo"></div>
    <div class="grid">
      <label><span>Порт (UDP)</span><select name="portMode">
        <option value="443">443 — как обычный HTTPS/QUIC</option>
        <option value="custom">свой</option>
        <option value="20000-50000">диапазон 20000-50000 (port hopping)</option></select></label>
      <label id="hyPortWrap"><span>Свой порт</span><input name="port" type="number" min="1" max="65535"></label>
      <label class="full"><span>Обфускация</span><select name="obfs">
        <option value="salamander">salamander — трафик не похож ни на что (рекомендую)</option>
        <option value="gecko">gecko — salamander + дробление рукопожатия (экспериментальная)</option>
        <option value="none">без обфускации — выглядит как HTTP/3-сайт</option></select></label>
      <label class="full"><span>Сертификат</span><select name="cert">
        <option value="self">self-signed — домен не нужен, клиенты сверяют отпечаток</option>
        <option value="acme">свой домен, Let's Encrypt</option></select></label>
      <label id="hyDomainWrap"><span>Домен (A-запись на этот сервер)</span><input name="domain" autocapitalize="off"></label>
      <label id="hyEmailWrap"><span>E-mail для Let's Encrypt</span><input name="email" type="email" placeholder="необязательно"></label>
    </div>
    <div class="mute small hint" id="hyHint"></div>
    <div class="row"><button type="button" onclick="$('#hyDlg').close()">Отмена</button><button class="pri" value="ok" id="hyBtn">Установить</button></div>
  </form>
</dialog>

<dialog id="jobDlg">
  <div class="dlg">
    <div class="dlg-h"><h2 id="jobTitle"></h2><button class="icon ghost" onclick="$('#jobDlg').close()" aria-label="Закрыть"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="mute small" id="jobState" style="margin-bottom:10px"></div>
    <pre class="joblog" id="jobLog"></pre>
    <div class="row"><button class="pri" onclick="$('#jobDlg').close()">Закрыть</button></div>
  </div>
</dialog>

<div id="toasts" popover="manual" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
let S = null, stateReceivedAt = 0, editing = null, shareUser = null, filter = 'all';

const GB = 1024 ** 3;
function fmt(b) {
  const u = ['Б','КБ','МБ','ГБ','ТБ']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++ }
  return (i ? b.toFixed(b < 10 ? 2 : 1) : b) + ' ' + u[i];
}
function ago(t) {
  if (!t) return 'никогда';
  const s = Date.now() / 1000 - t;
  if (s < 60) return 'только что';
  if (s < 3600) return Math.floor(s / 60) + ' мин назад';
  if (s < 86400) return Math.floor(s / 3600) + ' ч назад';
  return new Date(t * 1000).toLocaleDateString('ru-RU');
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;

// Toasts live in the top layer (a popover), shown again on each one so
// they stand above an open dialog, which is there too.
function toast(msg, bad) {
  const box = $('#toasts'), t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
  box.append(t);
  try { if (box.matches(':popover-open')) box.hidePopover(); box.showPopover(); } catch {}
  setTimeout(() => {
    t.remove();
    if (!box.children.length) try { box.hidePopover(); } catch {}
  }, bad ? 5000 : 2200);
}

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: body ? {'Content-Type': 'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401 && path !== 'api/login') { showLogin(); throw new Error('unauthorized'); }
  if (!r.ok) { const t = (await r.text()).trim() || r.statusText; toast(t, true); throw new Error(t); }
  const ct = r.headers.get('content-type') || '';
  return ct.includes('json') ? r.json() : r.text();
}

// ---- theme: the system's until the viewer picks one; kept in this browser ----
function setTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const b = $('#themeBtn'), label = dark ? 'Светлая тема' : 'Тёмная тема';
  b.title = label; b.setAttribute('aria-label', label);
  b.querySelector('use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
}
function toggleTheme() {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', t); } catch {}
  setTheme(t);
}
let savedTheme = null;
try { savedTheme = localStorage.getItem('theme'); } catch {}
setTheme(savedTheme);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTheme(document.documentElement.dataset.theme));

function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#login input').focus(); }
$('#login form').onsubmit = async e => {
  e.preventDefault();
  try { await api('POST', 'api/login', {password: e.target.password.value}); e.target.reset(); load(); loadSystem(); } catch {}
};
async function logout() { await api('POST', 'api/logout'); showLogin(); }

async function load() {
  try { S = await api('GET', 'api/state'); stateReceivedAt = Date.now(); }
  catch { if (S) refreshOnlineView(); return; }
  $('#login').hidden = true; $('#app').hidden = false;
  $('#host').textContent = 'Сервер ' + S.server.host;
  $('#hyerr').hidden = !S.problems;
  $('#hyerr').innerHTML = icon('alert') + '<span>' + esc(S.problems) + '</span>';
  refreshOnlineView();
}

function refreshOnlineView() {
  stats();
  render();
  if (SYS) renderProtocols();
}

// ---- protocols: installed and configured by the agent ----
let SYS = null;
async function loadSystem() {
  try { SYS = await api('GET', 'api/system'); } catch { return; }
  renderProtocols();
}
function renderProtocols() {
  if (!SYS) return;
  const s = SYS.status?.hysteria2 || {}, c = SYS.settings?.hysteria2;
  const unavailable = !!SYS.agentError;
  const title = unavailable ? 'Состояние сервера неизвестно' : c ? s.active ? 'Сервер работает' : 'Сервер остановлен'
    : s.installed ? 'Hysteria не настроена' : 'Hysteria не установлена';
  const tone = unavailable ? 'warn' : c ? s.active ? 'ok' : 'bad' : '';
  const action = c ? 'Настройки' : s.installed ? 'Настроить' : 'Установить';
  $('#serverStatus').innerHTML = `<div class="server-bar"><div class="server-state"><span class="server-dot ${tone}" aria-hidden="true"></span><span>${title}</span>${c ? `<span class="mute small">UDP ${esc(c.port)}</span>` : ''}</div><div class="server-actions">${s.update && !unavailable ? `<button data-do="update">Обновить до ${esc(s.latest)}</button>` : ''}<button class="${c ? '' : 'pri'}" data-do="cfg">${action}</button></div></div>`
    + (unavailable ? `<div class="err">${icon('alert')}<span>${esc(SYS.agentError)}</span></div>` : '');

}
function renderHyInfo() {
  if (!SYS) return;
  const s = SYS.status?.hysteria2 || {}, c = SYS.settings?.hysteria2;
  let version = s.installed ? `Версия ${esc(s.version)}` : 'Не установлена';
  if (s.installed) version += s.update ? ` · доступна ${esc(s.latest)}` : s.latest ? ' · последняя' : ' · обновления не проверены';
  $('#hyInfo').innerHTML = `<div>${version}</div>`
    + (s.latestErr && !s.latest ? `<div class="mute">${esc(s.latestErr)}</div>` : '')
    + (c ? `<div class="detail"><span class="mute">Обфускация</span><span>${esc(c.obfs || 'без обфускации')}</span></div><div class="detail"><span class="mute">Сертификат</span><span>${c.domain ? esc(c.domain) + " (Let's Encrypt)" : 'Самоподписанный'}</span></div>` : '')
    + (c && S ? onlineInfo('hysteria2') : '')
    + (s.installed ? `<div class="detail-actions"><button type="button" data-do="check">Проверить обновления</button>${s.update ? `<button type="button" data-do="update">Обновить до ${esc(s.latest)}</button>` : ''}</div>` : '');
}
function systemAction(e) {

  else if (b.dataset.do === 'check') checkReleases(b);
  else if (confirm('Скачать последний релиз Hysteria 2 и перезапустить его? Подключения прервутся на секунду.')) {

}
$('#serverStatus').onclick = systemAction;
$('#hyInfo').onclick = systemAction;

async function checkReleases(b) {
  b.disabled = true; b.textContent = 'Проверяю…';
  try { SYS = await api('POST', 'api/system/releases'); } catch { return renderProtocols(); }
  renderProtocols();
  const s = SYS.status?.hysteria2 || {};
  if (s.update) toast(`Hysteria 2: вышла ${s.latest}`);
  else if (s.latest) toast(`Hysteria 2: ${s.version} — последняя версия`);
  else toast(`Hysteria 2: ${s.latestErr || 'GitHub не ответил'}`, true);

function openHy() {

  renderHyInfo();
  const port = c ? c.port : '443';
  f.portMode.value = ['443', '20000-50000'].includes(port) ? port : 'custom';
  f.port.value = f.portMode.value === 'custom' ? port : '';

function hyToggle() {

}
$('#hyForm').onchange = hyToggle;
$('#hyDlg').onclose = () => {
  if ($('#hyDlg').returnValue !== 'ok') return;
  const f = $('#hyForm');
  const params = {port: f.portMode.value === 'custom' ? f.port.value : f.portMode.value, obfs: f.obfs.value, cert: f.cert.value};
  if (f.cert.value === 'acme') { params.domain = f.domain.value.trim().toLowerCase(); params.email = f.email.value.trim(); }
  startJob('hysteria', params, SYS.settings.hysteria2 ? 'Настройка Hysteria 2' : 'Установка Hysteria 2');
};

// startJob asks the agent to run a job and follows its log. The panel
// restarts at the end of most jobs: polling errors only mean "wait".
async function startJob(action, params, title) {
  try { await api('POST', 'api/system/jobs', {action, params}); } catch { return; }
  $('#jobTitle').textContent = title; $('#jobLog').textContent = ''; $('#jobState').textContent = 'Идёт…';
  if (!$('#jobDlg').open) $('#jobDlg').showModal();
  const t0 = Date.now(), secs = () => Math.round((Date.now() - t0) / 1000);
  let lost = 0;
  for (;;) {
    await new Promise(r => setTimeout(r, 1000));
    let j = null;
    try { const r = await fetch('api/system/job'); if (r.ok) j = await r.json(); } catch {}
    if (!j) { // the panel is restarting after the change, or unreachable
      lost++;
      $('#jobState').textContent = `Идёт… ${secs()} с` + (lost > 3 ? ' · панель перезапускается, жду связи' : '');
      continue;
    }
    lost = 0;
    const log = $('#jobLog'), end = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent = j.log; if (end) log.scrollTop = log.scrollHeight;
    if (j.running) {
      const last = j.log.trim().split('\n').pop() || '';
      $('#jobState').textContent = `Идёт… ${secs()} с` + (last ? ' · ' + last.slice(0, 80) : '');
      continue;
    }
    $('#jobState').innerHTML = j.ok ? '<span class="pill ok">готово</span>' : '<span class="pill bad">ошибка — подробности в логе</span>';
    await load(); await loadSystem();
    if (j.ok) { // nothing to read on success: the window goes, the cards show the result
      toast(title + ': готово');
      setTimeout(() => $('#jobDlg').close(), 1500);
    }
    return;
  }
}

// Hysteria online sessions.
function onlineStale(p) {
  const s = S.onlineStatus?.[p];
  const now = S.serverTime + (Date.now() - stateReceivedAt) / 1000;
  return !s || s.stale || !s.lastSuccess || now - s.lastSuccess >= S.onlineFreshFor;
}
function onlineInfo(p) {
  const s = S.onlineStatus?.[p], last = s?.lastSuccess;
  const when = last ? new Date(last * 1000).toLocaleString('ru-RU') : 'ещё не было';
  return `<div class="small ${onlineStale(p) ? 'check bad' : 'mute'}">Онлайн: ${last ? onlineStale(p) ? 'данные устарели' : 'данные актуальны' : 'ожидаем данные'}<br>Последний успешный опрос: ${esc(when)}</div>`;
}
const liveOn = (u, p) => onlineStale(p) ? 0 : u.online[p] || 0;
const isOn = u => Object.keys(u.online).some(p => liveOn(u, p) > 0);
const protos = () => S.server.protocols || [];
const userProtos = u => u.links.map(l => l.proto);
function stats() {
  const us = S.users, on = us.filter(isOn);
  const up = us.reduce((s, u) => s + u.up, 0), down = us.reduce((s, u) => s + u.down, 0);
  $('#stUsers').textContent = us.length;
  const enabled = us.filter(u => u.enabled).length;
  $('#stUsersSub').textContent = `Включены ${enabled}`;
  $('#stUsersSub').hidden = enabled === us.length;
  const stale = protos().some(p => onlineStale(p.id));
  $('#stOnline').textContent = stale ? on.length ? '≥ ' + on.length : '—' : on.length;
  const sessions = on.reduce((n, u) => n + liveOn(u, 'hysteria2'), 0);
  $('#stOnline').title = stale ? 'Данные о подключениях устарели' : `Пользователей: ${on.length}. Подключений: ${sessions}.`;
  $('#stOnlineSub').hidden = !stale;
  $('#stOnlineSub').textContent = stale ? 'Данные устарели' : '';
  $('#stTraffic').textContent = fmt(up + down);
  $('#stTraffic').title = `↓ ${fmt(down)} ↑ ${fmt(up)}`;
}

const statusTag = {disabled: ['выключен', 'bad'], expired: ['истёк', 'bad'], quota: ['лимит', 'bad']};
// Stable soft colour per name, so a user is recognisable at a glance.
function hue(n) { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const daysLeft = u => u.expiresAt ? Math.ceil((u.expiresAt - Date.now() / 1000) / 86400) : null;
const hasIssue = u => u.status || (daysLeft(u) ?? 99) <= 3 || (u.quotaBytes && (u.up + u.down) / u.quotaBytes >= .9);

function render() {
  const L = $('#list'), q = $('#q').value.trim().toLowerCase();
  if (!S.users.length) {
    L.innerHTML = `<div class="empty"><div class="mute">Пользователей пока нет</div><button class="pri" onclick="openEdit()">${icon('plus')}Создать первого</button></div>`;
    return;
  }
  const list = S.users.filter(u =>
    (!q || u.name.includes(q) || (u.note || '').toLowerCase().includes(q)) &&
    (filter === 'all' || (filter === 'online' ? isOn(u) : hasIssue(u))));
  if (!list.length) { L.innerHTML = '<div class="empty mute">Ничего не найдено</div>'; return; }
  L.innerHTML = list.map(u => {
    const used = u.up + u.down, st = statusTag[u.status], days = daysLeft(u);
    const pct = u.quotaBytes ? Math.min(100, used / u.quotaBytes * 100) : 0;
    const h = hue(u.name);
    const stale = userProtos(u).includes('hysteria2') && onlineStale('hysteria2');
    const n = liveOn(u, 'hysteria2');
    const onlineTip = stale ? 'Данные о подключениях устарели' : n ? `Онлайн. Подключений: ${n}` : 'Не подключён';
    const sessions = !stale && (n > 1 || u.maxDevices) ? `<span class="sessions" title="Подключения${u.maxDevices ? ': лимит ' + u.maxDevices : ''}">${n}${u.maxDevices ? '/' + u.maxDevices : ''} подкл.</span>` : '';
    return `<div class="user${u.enabled ? '' : ' off'}" data-n="${esc(u.name)}">
      <div class="av${stale ? ' stale' : isOn(u) ? ' on' : ''}" style="--h:${h}" title="${onlineTip}" aria-label="${esc(u.name)}: ${onlineTip}">${esc(u.name[0])}</div>
      <div class="body">
        <div class="name">${esc(u.name)}
          ${st ? `<span class="pill ${st[1]}">${st[0]}</span>` : ''}
          ${!st && days !== null && days <= 3 ? `<span class="pill warn">${days > 0 ? days + ' дн.' : 'сегодня'}</span>` : ''}
          ${sessions}
        </div>
        <div class="meta mute small">
          <span>↓ ${fmt(u.down)} ↑ ${fmt(u.up)}${u.quotaBytes ? ' из ' + fmt(u.quotaBytes) : ''}</span>
          ${u.resetMonthly ? '<span>сброс 1-го</span>' : ''}
          ${isOn(u) ? '' : `<span>был ${ago(u.lastSeen)}</span>`}
          ${u.expiresAt ? `<span>до ${new Date(u.expiresAt * 1000).toLocaleDateString('ru-RU')}</span>` : ''}
          ${u.note ? `<span class="note">${esc(u.note)}</span>` : ''}
        </div>
        ${u.quotaBytes ? `<div class="prog${pct >= 100 ? ' bad' : pct >= 90 ? ' warn' : ''}"><i style="width:${pct}%"></i></div>` : ''}
      </div>
      <div class="acts">
        <input type="checkbox" class="sw" data-a="toggle" ${u.enabled ? 'checked' : ''} title="${u.enabled ? 'Выключить' : 'Включить'}" aria-label="Включён">
        <button class="icon ghost" data-a="share" title="QR и ссылки" aria-label="QR и ссылки">${icon('qr')}</button>
        <button class="icon ghost" data-a="edit" title="Изменить" aria-label="Изменить">${icon('edit')}</button>
        <button class="icon ghost" data-a="reset" title="Сбросить счётчик трафика" aria-label="Сбросить трафик">${icon('reset')}</button>
        <button class="icon ghost danger" data-a="del" title="Удалить" aria-label="Удалить">${icon('trash')}</button>
      </div>
    </div>`;
  }).join('');
}

$('#q').oninput = () => S && render();

const find = n => S.users.find(u => u.name === n);
async function toggle(n) {
  const on = !find(n).enabled;
  try { await api('PATCH', 'api/users/' + n, {enabled: on}); toast(`${n}: ${on ? 'включён' : 'выключен'}`); } catch {}

}
async function resetT(n) { if (confirm(`Сбросить трафик ${n}?`)) { try { await api('PATCH', 'api/users/' + n, {resetTraffic: true}); toast('Трафик сброшен'); } catch {} load(); } }
async function del(n) { if (confirm(`Удалить ${n}? Клиент будет отключён.`)) { try { await api('DELETE', 'api/users/' + n); toast(`${n} удалён`); } catch {} load(); } }

function openEdit(n) {
  editing = n ? find(n) : null;
  const f = $('#editForm'), u = editing || {};
  $('#editTitle').textContent = editing ? editing.name : 'Новый пользователь';
  $('#nameWrap').hidden = !!editing; f.name.required = !editing;
  f.name.value = u.name || '';

  f.devices.value = u.maxDevices || '';
  f.monthly.checked = !!u.resetMonthly;
  f.expires.value = u.expiresAt ? localDate(u.expiresAt) : '';
  f.password.value = ''; f.password.placeholder = editing ? 'не менять' : 'случайный';
  f.note.value = u.note || '';

$('#edit').onclose = async () => {
  if ($('#edit').returnValue !== 'ok') return;
  const f = $('#editForm');
  const body = {
    quotaBytes: Math.round((+f.quota.value || 0) * GB),
    maxDevices: +f.devices.value || 0,
    resetMonthly: f.monthly.checked,
    expiresAt: f.expires.value ? Math.floor(new Date(f.expires.value + 'T23:59:59').getTime() / 1000) : 0,
    note: f.note.value,
  };
  if (f.password.value) body.password = f.password.value;
  try {
    if (editing) { await api('PATCH', 'api/users/' + editing.name, body); toast('Сохранено'); }

async function rekey() {

const localDate = t => { const d = new Date(t * 1000); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
let shareTab = '', mihomoView = '', dlURL = '';

const protoName = id => (protos().find(p => p.id === id) || {title: id}).title;
const hints = {
  hysteria2: 'Hiddify, v2RayTun, Happ, Shadowrocket, v2rayN, официальный клиент.',
};
async function setTab(t) {
  shareTab = t;
  $('#tabs').querySelectorAll('button').forEach(b => b.classList.toggle('act', b.dataset.t === t));
  const u = shareUser, q = 'api/users/' + u.name + '/qr.png?t=' + Date.now(), names = u.links.map(l => protoName(l.proto));
  let text = '', hint = '', qr = '';
  const l = u.links.find(l => l.proto === t);
  if (!t) hint = 'Hysteria ещё не настроена.';
  if (l) { text = l.uri; qr = q + '&proto=' + t; hint = typeof hints[t] === 'function' ? hints[t]() : hints[t] || ''; }
  if (t === 'sub') {
    text = S.subBase + u.subPath; qr = q + '&sub=1';
    hint = 'Клиент сам обновляет конфиг и видит остаток трафика и срок. Clash Verge и mihomo получают полный конфиг (как «Mihomo → Компьютер»).' + (names.length > 1 ? ' Внутри: ' + names.join(', ') + '.' : '');
  }
  $('#mtabs').hidden = t !== 'mihomo';
  if (t === 'mihomo') {
    // Whole configs first, then the pieces for one's own config.
    const parts = u.links.map(l => [l.proto, protoName(l.proto)]);
    const btn = ([v, title]) => `<button data-v="${esc(v)}" style="flex:1" class="${v === mihomoView ? 'act' : ''}">${esc(title)}</button>`;
    $('#mtabs').innerHTML = [['router', 'Роутер (XKeen)'], ['desktop', 'Компьютер (Clash Verge)'], ...parts].map(btn).join('');
    const base = 'api/users/' + encodeURIComponent(u.name) + '/mihomo';
    const full = mihomoView === 'router' || mihomoView === 'desktop';
    const path = base + (full ? '?full=' + mihomoView : '?proto=' + mihomoView);
    try { text = await api('GET', path); } catch { text = ''; }
    if (full) dlURL = path + '&download=1';
    hint = {
      router: 'Полный конфиг для mihomo в XKeen на роутере: прокси пользователя, группы и правила (заблокированное — через VPN, остальное напрямую). Замени им конфиг mihomo в XKeen (обычно /opt/etc/mihomo/config.yaml). Панель zashboard: http://<роутер>:9090/ui, пароль — secret в конфиге.',
      desktop: 'Полный конфиг для Clash Verge и mihomo на компьютере: в Clash Verge — «Профили» → «Новый» → Local, стереть всё и вставить целиком, или скачать файл и импортировать. Ссылка «Подписка» отдаёт Clash Verge тот же конфиг, и он обновляется сам.',
    }[mihomoView] || `Прокси ${protoName(mihomoView)}: вставь в proxies: конфига mihomo.`;
  }
  $('#shareText').value = text; $('#shareHint').textContent = hint;
  $('#qr').hidden = !qr; if (qr) $('#qr').src = qr;
  const full = t === 'mihomo' && (mihomoView === 'router' || mihomoView === 'desktop');
  $('#shareText').rows = t === 'mihomo' ? (full ? 20 : 12) : 4;
  $('#dlConf').hidden = !full;
  $('#dlConf').textContent = 'Скачать .yaml';
}
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); };
$('#mtabs').onclick = e => { const b = e.target.closest('button'); if (b) { mihomoView = b.dataset.v; setTab('mihomo'); } };
async function copyShare() {
  const t = $('#shareText');
  try { await navigator.clipboard.writeText(t.value); } catch { t.select(); document.execCommand('copy'); }
  toast('Скопировано');
}

load(); loadSystem();
setInterval(() => { if (!document.hidden && !$('#app').hidden && !document.querySelector('dialog[open]')) loadSystem(); }, 30000);
// The server syncs every 10s; polling faster or in a hidden tab only repeats data.
setInterval(() => { if (!document.hidden && !$('#app').hidden && !document.querySelector('dialog[open]')) load(); }, 10000);
</script>
